  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Leaflet CSS — MUST be before any Leaflet JS -->

    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- App Custom CSS -->
  <link rel="stylesheet" href="styles/main.css" />

  <!-- ═══════════════════════════════════════════════════════
       TAILWIND CONFIGURATION
       ════════════════════════════════════════════════════ -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            coffee: {
              darkest: '#1a0f0a',
              dark:    '#2c1a0e',
              rich:    '#4a2c17',
              medium:  '#7b4f2e',
              light:   '#c9956c',
              cream:   '#f5e6d3',
              latte:   '#e8d5bb',
            },
            gold: '#d4a853',
          },
          fontFamily: {
            display: ['"Playfair Display"', 'Georgia', 'serif'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      },

  </script>

</head>

<body>
  <!--
    ╔══════════════════════════════════════════════════════╗
    ║  VUE 3 APP ROOT — All content is rendered by Vue     ║
    ╚══════════════════════════════════════════════════════╝
  -->
  <div id="app" role="application" aria-label="Quiero un Café — Directorio de Caracas">
    <!-- Accessible no-JS fallback -->
    <noscript>
      <div style="padding:3rem;text-align:center;font-family:Georgia,serif;background:#fdf8f3;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;">
        <span style="font-size:4rem;">☕</span>
        <h1 style="font-size:2rem;color:#1a0f0a;">Quiero un Café</h1>
        <p style="color:#7b4f2e;max-width:400px;">
          Esta aplicación requiere JavaScript para mostrar el mapa interactivo
          y el directorio de cafeterías. Por favor actívalo en tu navegador.
        </p>
      </div>
    </noscript>
  </div>

  <!-- ═══════════════════════════════════════════════════════
       SCRIPTS — Load order is critical:
       1. Leaflet (needs DOM, no deps)
       2. Vue 3  (no deps)
       3. Mock Data (global constant)
       4. App logic (uses Vue + Leaflet + CAFES_DATA)
       ════════════════════════════════════════════════════ -->

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>

  <script src="data/cafes.js"></script>
  <script src="data/wiki.js"></script>
  <script src="app.js"></script>
</body>
</html>
